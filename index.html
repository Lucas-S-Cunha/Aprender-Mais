<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprender+ | Acesso</title>
<meta name="theme-color" content="#0a1430">
<style>
:root{font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;color:#eaf0ff;background:#08122a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 15%,#183a75 0,transparent 40%),linear-gradient(140deg,#071025,#0a1734 55%,#0c2047);display:grid;place-items:center;padding:24px}
.login-wrap{width:min(100%,460px)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;justify-content:center}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#3c91ff,#1769ff);display:grid;place-items:center;box-shadow:0 10px 35px #1769ff40}
.logo svg{width:29px;height:29px}
.brand-title{font-size:27px;font-weight:800;letter-spacing:-.5px}.brand-title span{color:#54a0ff}
.panel{border:1px solid #ffffff1b;background:#0d1d3ce8;backdrop-filter:blur(14px);border-radius:22px;padding:30px;box-shadow:0 25px 80px #0004}
h1{margin:0 0 10px;font-size:27px;letter-spacing:-.5px}
.subtitle{margin:0 0 26px;color:#aabbdc;line-height:1.55}
.google{width:100%;border:1px solid #d5def0;background:#fff;color:#202632;border-radius:12px;padding:13px 16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:.15s}
.google:hover{transform:translateY(-1px);box-shadow:0 8px 25px #0002}
.google:disabled{opacity:.6;cursor:wait}
.gicon{width:20px;height:20px}
.status{min-height:22px;margin:16px 0 0;color:#aabbdc;font-size:13px}
.status.error{color:#ff9b9b}
.privacy{font-size:12px;color:#8497bd;line-height:1.5;text-align:center;margin:18px 0 0}
#app-shell{position:fixed;inset:0;background:#08122a;display:none}
#app-frame{width:100%;height:100%;border:0;background:transparent}
.topbar{position:absolute;z-index:9;top:12px;right:12px}
.logout{border:1px solid #ffffff25;background:#12244b;color:#eaf0ff;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:600}
@media(max-width:480px){.panel{padding:24px}.brand-title{font-size:24px}}
</style>
</head>
<body>
<div class="login-wrap" id="login-view">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 4l9 4.5-9 4.5z"/><path d="M6 10v5.3c3.2 2.4 8.8 2.4 12 0V10"/><path d="M21 9v5"/></svg></div>
    <div class="brand-title">Aprender<span>+</span></div>
  </div>
  <section class="panel">
    <h1>Bem-vindo ao Aprender+</h1>
    <p class="subtitle">Entre com sua conta Google para acessar a plataforma de aplicação e correção de gabaritos.</p>
    <button class="google" id="google-login" type="button">
      <svg class="gicon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11c-.5 2.5-2 4.6-4.2 6v5h6.8c4-3.7 6.3-9.1 6.3-14.7z"/><path fill="#34A853" d="M24 44c5.7 0 10.5-1.9 14-5.1l-6.8-5c-1.9 1.3-4.3 2-7.2 2-5.5 0-10.1-3.7-11.8-8.7H3.2v5.2C6.7 38.9 14.7 44 24 44z"/><path fill="#FBBC05" d="M12.2 27.2c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4v-5.2H3.2C1.5 16.3.5 19.5.5 22.8s1 6.5 2.7 9.6l9-5.2z"/><path fill="#EA4335" d="M24 10.2c3.1 0 5.9 1.1 8.1 3.3l6.1-6.1C34.5 3.8 29.7 1.6 24 1.6 14.7 1.6 6.7 6.7 3.2 13.2l9 5.2c1.7-5 6.3-8.2 11.8-8.2z"/></svg>
      Continuar com Google
    </button>
    <p class="status" id="status" role="status"></p>
  </section>
  <p class="privacy">O acesso é feito pela autenticação do Google. Configure o Firebase no arquivo para ativar o login.</p>
</div>

<div id="app-shell">
  <div class="topbar"><button class="logout" id="logout" type="button">Sair da conta</button></div>
  <iframe id="app-frame" title="Aplicativo Aprender+" src="about:blank"></iframe>
</div>


<script type="module">
  // feito por IA - correção dos imports e inicialização do Firebase

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Configuração Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAjHsmmwYWuRSOuaG5ik8vRLm8O7JPJpSM",
    authDomain: "aprendermais-4d2d5.firebaseapp.com",
    projectId: "aprendermais-4d2d5",
    storageBucket: "aprendermais-4d2d5.firebasestorage.app",
    messagingSenderId: "132236892368",
    appId: "1:132236892368:web:a45dac5f7e5cd87b83e6d5"
  };

  // Inicialização
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const APP_FILE = "./Aprender+.html";

  const statusEl = document.getElementById("status");
  const loginBtn = document.getElementById("google-login");
  const loginView = document.getElementById("login-view");
  const appShell = document.getElementById("app-shell");
  const frame = document.getElementById("app-frame");

  function showStatus(message, isError = false) {
    statusEl.textContent = message;
    statusEl.classList.toggle("error", isError);
  }

  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  // Login Google
  loginBtn.addEventListener("click", async () => {
    loginBtn.disabled = true;
    showStatus("Abrindo login Google…");

    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      console.error("Erro no login:", error);
      showStatus(error.message || "Não foi possível entrar.", true);
    } finally {
      loginBtn.disabled = false;
    }
  });

  // Logout
  document.getElementById("logout").addEventListener("click", async () => {
    try {
      await signOut(auth);
      frame.src = "about:blank";
    } catch (error) {
      console.error("Erro ao sair:", error);
    }
  });

  // Verifica autenticação
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginView.style.display = "none";
      appShell.style.display = "block";

      if (frame.src.endsWith("about:blank")) {
        frame.src = APP_FILE;
      }
    } else {
      loginView.style.display = "block";
      appShell.style.display = "none";
      frame.src = "about:blank";
      showStatus("");
    }
  });
</script>
</body>
</html>
