<script>

 for(const c of L(d.classes,200))o.classes.push({id:clean(c.id,12),name:clean(c.name,30),subjects:L(c.subjects,20).map(x=>clean(x,30)).filter(Boolean),students:L(c.students,1000).map(s=>({id:ID4(String(s.id)),name:clean(s.name),birth:D(s.birth)})).filter(s=>s.id&&s.name)});
 for(const e of L(d.exams,1000))if(/^[ABCDX]{1,30}$/.test(e.key))o.exams.push({id:clean(e.id,12),title:clean(e.title,50),cid:clean(e.cid,12),subj:clean(e.subj,30),date:D(e.date),key:e.key});
 for(const r of L(d.res,20000))if(/^[ABCDX]{1,30}$/.test(r.k)&&/^[ABCD-]{1,30}$/.test(r.a)&&r.a.length==r.k.length)o.res.push({e:clean(r.e,12),s:ID4(String(r.s||'')),c:clean(r.c,12),n:clean(r.n,30),cl:clean(r.cl,30),t:clean(r.t,30),d:D(r.d),k:r.k,a:r.a});
 return o}
function merge(d){if(!S.teacher&&d.teacher)S.teacher=d.teacher;for(const c of d.classes){const x=S.classes.find(y=>y.id==c.id);if(!x)S.classes.push(c);else{x.name=c.name;c.subjects.forEach(m=>x.subjects.includes(m)||x.subjects.push(m));c.students.forEach(s=>x.students.some(t=>t.id==s.id)||x.students.push(s))}}

let S={classes:[],exams:[],res:[],teacher:''};try{S=fix(JSON.parse(localStorage.getItem('apl')))}catch{}if(!S.teacher&&(S.classes.length||S.exams.length||S.res.length))S.teacher='Professor(a)';

let page='home',cur={c:'',m:''},q='',pp=5,pg=1,fm={n:10,k:[],t:'',d:''},ed=null,arm='',mp='rd',view=null,pend=null,ppg=4;

const sc=r=>[...r.k].filter((x,i)=>x=='X'||x==r.a[i]).length,gr=r=>sc(r)/r.k.length*10,avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

const pick=()=>`<div class="cd fl"><label>Turma<br><select onchange="cur.c=this.value;cur.m='';pg=1;go()"><option value="">Escolha</option>${S.classes.map(c=>`<option value="${esc(c.id)}"${c.id==cur.c?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Matéria<br><select ${cur.c?'':'disabled'} onchange="cur.m=this.value;pg=1;go()"><option value="">Escolha</option>${(cls()?.subjects||[]).map(m=>`<option${m==cur.m?' selected':''}>${esc(m)}</option>`).join('')}</select></label></div>`;

/* ===== desktop ===== */
const MENU=[['home','⌂','Início'],['prov','✎','Provas e Gabaritos'],['est','▮','Estatísticas'],['tur','☻','Turmas e Alunos'],['cfg','⚙','Configurações']];
function dView(){const t=MENU.find(m=>m[0]==page)[2];
 return `<div class="sb${localStorage.getItem('sbc')?' c':''}" id="sb"><div class="lg" onclick="page='home';go()">${logo}<span class="t">Aprender<b>+</b></span></div>${MENU.map(m=>`<div class="mi${m[0]==page?' on':''}" onclick="page='${m[0]}';arm='';ed=null;go()"><span>${m[1]}</span><span class="t">${m[2]}</span></div>`).join('')}</div>
 <div class="mn"><div class="tp"><button class="hb" onclick="const s=$('#sb').classList.toggle('c');s?localStorage.setItem('sbc',1):localStorage.removeItem('sbc')">☰</button><h2>${t}</h2><span>👤 ${esc(S.teacher)}</span></div><div id="ms"></div>${pendH()}${P[page]()}</div>`}
const P={
home(){let b='';if(ready()){const st=cls().students,all=exs().flatMap(rs),dif=st.map(s=>[s,sAvg(s)]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1]).slice(0,5);
 b=`<div class="g">${card('Total de alunos',st.length)}${card('Nota média da turma',f1(avg(all.map(gr))))}${card('Desempenho médio',all.length?Math.round(avg(all.map(r=>sc(r)/r.k.length))*100)+'%':'—')}</div><div class="cd"><b>Alunos com maior dificuldade</b><table>${dif.map(([s,a])=>`<tr><td>${esc(s.name)}</td><td>${f1(a)}</td></tr>`).join('')||'<tr><td class="mu">Sem resultados ainda.</td></tr>'}</table></div>`}
 return pick()+b},
prov(){let b='';if(ready()){b=`<div class="cd"><div class="fl" style="justify-content:space-between"><b>Provas e gabaritos</b><span class="fl"><label class="mu">Gabaritos por página <select style="min-width:90px" onchange="ppg=+this.value;go()"><option value="4"${ppg==4?' selected':''}>4 (compacto)</option><option value="1"${ppg==1?' selected':''}>1 (tamanho cheio)</option></select></label><button class="bt" onclick="fm={n:10,k:[],t:'',d:''};ed='ex';go()">+ Criar gabarito</button></span></div>
 ${ed=='ex'?`<div class="fl" style="margin:12px 0"><label>Título<br><input id="et" maxlength="50" value="${esc(fm.t)}"></label><label>Data<br><input id="ed" type="date" value="${fm.d}"></label><label>Questões (1–30)<br><input type="number" min="1" max="30" value="${fm.n}" style="min-width:80px" onchange="fm.t=$('#et').value;fm.d=$('#ed').value;fm.n=Math.min(30,Math.max(1,+this.value||1));go()"></label></div><b>${fm.id?'Editar gabarito oficial':'Gabarito oficial'}</b><div class="fl" style="margin:8px 0">${Array.from({length:fm.n},(_,i)=>`<label>${i+1}<br><select style="min-width:56px" onchange="fm.k[${i}]=this.value">${[...'ABCDX'].map(x=>`<option value="${x}"${(fm.k[i]||'A')==x?' selected':''}>${x=='X'?'Anul.':x}</option>`).join('')}</select></label>`).join('')}</div><button class="bt" onclick="saveEx()">Salvar gabarito</button> <button class="bt o" onclick="ed=null;go()">Cancelar</button><p class="mu">Anul. anula a questão: ela vale ponto para todos. Ao editar, os resultados já lidos são recalculados.</p>`:''}
 <div class="w"><table><tr><th>Prova</th><th>Data</th><th>Nota média</th><th>Faltas</th><th>Ações</th></tr>${exs().map(e=>{const r=rs(e);return `<tr><td>${esc(e.title)}</td><td>${e.date.split('-').reverse().join('/')}</td><td>${f1(avg(r.map(gr)))}</td><td>${Math.max(0,cls().students.length-new Set(r.map(x=>x.s)).size)}</td><td><button class="bt o" onclick="editEx('${e.id}')">Editar</button> <button class="bt o" onclick="pr('${e.id}')">Imprimir</button> ${arm2('e'+e.id,'Excluir',`S.exams=S.exams.filter(x=>x.id!='${e.id}');S.res=S.res.filter(x=>x.e!='${e.id}');save()`)}</td></tr>`}).join('')||'<tr><td colspan="5" class="mu">Nenhum gabarito criado.</td></tr>'}</table></div></div>`}
 return pick()+b},
est(){let b='';if(ready()){const E=exs(),all=E.flatMap(rs),last=[...E].reverse().find(e=>rs(e).length);
 b=`<div class="g">${card('Total de alunos',cls().students.length)}${card('Nota média',f1(avg(all.map(gr))))}${card('Desempenho',all.length?Math.round(avg(all.map(r=>sc(r)/r.k.length))*100)+'%':'—')}</div>
 <div class="cd"><b>Nota média por gabarito</b>${E.map(e=>{const a=avg(rs(e).map(gr));return `<div style="margin:8px 0">${esc(e.title)} <small>${f1(a)}</small><div class="bar" style="width:${(a||0)*10}%"></div></div>`}).join('')||'<p class="mu">Sem gabaritos.</p>'}</div>
 ${last?`<div class="cd"><b>Taxa de erro por questão — ${esc(last.title)}</b><div class="fl" style="align-items:flex-end;height:150px;flex-wrap:nowrap;gap:4px;margin-top:10px">${[...last.key].map((k,i)=>{const r=rs(last),p=k=='X'?0:Math.round(r.filter(x=>x.a[i]!=k).length/r.length*100);return `<div class="col" style="height:100%"><i style="height:${p*1.2}px;${p>=40?'background:var(--er)':''}"></i>${i+1}<small>${p}%</small></div>`}).join('')}</div></div>`:''}`}
 return pick()+b},
tur(){let b='';const c=cls();if(ready()){const e=ed&&c.students.find(s=>s.id==ed);
 b=`<div class="cd"><b>${e?'Editar aluno':'Adicionar aluno'}</b><div class="fl" style="margin-top:8px"><input id="sn" maxlength="60" placeholder="Nome completo" value="${e?esc(e.name):''}"><input id="sb" type="date" value="${e?e.birth:''}"><button class="bt" onclick="saveSt()">${e?'Salvar':'+ Adicionar aluno'}</button></div></div>
 <div class="cd"><div class="fl"><input placeholder="Pesquisar aluno pelo nome..." value="${esc(q)}" oninput="q=clean(this.value);pg=1;$('#tb').innerHTML=stT()"><label>Por página <select style="min-width:70px" onchange="pp=+this.value;pg=1;$('#tb').innerHTML=stT()">${[5,10,25,50].map(n=>`<option${n==pp?' selected':''}>${n}</option>`).join('')}</select></label>${arm2('c','Excluir turma',`S.classes=S.classes.filter(x=>x.id!='${c.id}');S.exams=S.exams.filter(x=>x.cid!='${c.id}');cur={c:'',m:''};save()`)}</div><div id="tb" class="w">${stT()}</div></div>`}
 return `<div class="cd"><b>Nova turma</b><div class="fl" style="margin-top:8px"><input id="cn" maxlength="30" placeholder="Ex.: 1º Ano A"><input id="cs" maxlength="120" placeholder="Matérias separadas por vírgula" style="min-width:260px"><button class="bt" onclick="addCl()">+ Criar turma</button></div></div>`+pick()+b},
cfg(){return `<div class="cd"><b>Professor(a)</b><p class="mu">Este nome é gravado no ZIP e aparece no canto superior direito.</p><div class="fl"><input id="tn" maxlength="40" value="${esc(S.teacher)}"><button class="bt" onclick="setT()">Salvar nome</button></div></div><div class="cd"><b>Aparência</b><p class="mu">Alterne entre o tema claro e o escuro.</p><button class="bt" onclick="setTh()">Mudar para tema ${isDark()?'claro':'escuro'}</button></div><div class="cd"><b>Arquivo de sincronização (ZIP)</b><p class="mu">Tudo fica salvo no navegador até você exportar. Ao importar, o app identifica o tipo: um ZIP de leitura de gabaritos (do celular) apenas adiciona os resultados; um ZIP com todas as informações pede confirmação e substitui os dados atuais.</p><div class="fl"><button class="bt" onclick="exp()">Exportar ZIP</button><label class="bt o">Importar ZIP<input type="file" accept=".zip" hidden onchange="imp(this.files[0]);this.value=''"></label>${arm2('x','Apagar tudo','wipe()')}</div></div>`}};
function stT(){const c=cls(),f=c.students.filter(s=>asc(s.name).toLowerCase().includes(asc(q).toLowerCase())),n=Math.max(1,Math.ceil(f.length/pp));pg=Math.min(pg,n);
 return `<table><tr><th>Aluno</th><th>Nascimento</th><th>Matrícula</th><th>Nota média</th><th>Ações</th></tr>${f.slice((pg-1)*pp,pg*pp).map(s=>`<tr><td>${esc(s.name)}</td><td>${s.birth.split('-').reverse().join('/')}</td><td>${s.id}</td><td>${f1(sAvg(s))}</td><td><button class="bt o" onclick="ed='${s.id}';go()">Editar</button> ${arm2('s'+s.id,'Excluir',`cls().students=cls().students.filter(x=>x.id!='${s.id}');save()`)}</td></tr>`).join('')}</table><p class="mu">Mostrando ${f.length?(pg-1)*pp+1:0}–${Math.min(pg*pp,f.length)} de ${f.length} <button class="bt o" onclick="pg=Math.max(1,pg-1);$('#tb').innerHTML=stT()">‹</button> ${pg}/${n} <button class="bt o" onclick="pg=Math.min(${n},pg+1);$('#tb').innerHTML=stT()">›</button></p>`}
function addCl(){const n=clean($('#cn').value,30),m=[...new Set($('#cs').value.split(',').map(x=>clean(x,30)).filter(Boolean))].slice(0,20);if(!n||!m.length)return msg('Informe o nome da turma e ao menos uma matéria (somente letras, números e . , - ( ) /).');const c={id:uid(),name:n,subjects:m,students:[]};S.classes.push(c);cur={c:c.id,m:''};save();go()}
function saveSt(){const name=clean($('#sn').value),birth=D($('#sb').value);if(!name)return msg('Informe o nome do aluno (caracteres especiais são removidos).');const c=cls();
 if(ed){const s=c.students.find(x=>x.id==ed);s.name=name;s.birth=birth;ed=null}else{const n=Math.max(0,...S.classes.flatMap(x=>x.students).map(s=>+s.id))+1;if(n>9999)return msg('Limite de matrículas atingido.');c.students.push({id:String(n).padStart(4,'0'),name,birth})}save();go()}

function sheet(e,st){const cl=S.classes.find(c=>c.id==e.cid);
